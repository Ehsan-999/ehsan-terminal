<style>
  :root{
    --bg:#211d17;
    --bg-bar:#2a251d;
    --ink:#ece3cf;
    --ink-dim:#8f8672;
    --accent:#7fa895;
    --clay:#d99b5f;
    --err:#c97b6b;
    --border:#3a3327;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono','Vazirmatn',monospace;
    height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  ::selection{background:var(--accent); color:#211d17;}

  #titlebar{
    background:var(--bg-bar); border-bottom:1px solid var(--border);
    padding:10px 14px; display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .dots{display:flex; gap:7px;}
  .dots span{width:11px; height:11px; border-radius:50%; display:inline-block; opacity:.85;}
  .d1{background:#c97b6b;} .d2{background:#d9b45f;} .d3{background:#7fa895;}
  #titlebar .name{flex:1; text-align:center; font-size:.78rem; color:var(--ink-dim);}
  #lang-badge{
    font-size:.68rem; color:var(--ink-dim); border:1px solid var(--border); border-radius:5px;
    padding:3px 8px; flex-shrink:0;
  }

  #screen{
    flex:1; overflow-y:auto; padding:22px 22px 10px; font-size:.92rem; line-height:1.85;
    cursor:text; user-select:text; -webkit-user-select:text;
  }
  #screen::-webkit-scrollbar{width:9px;}
  #screen::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px;}

  .line{margin-bottom:2px; white-space:pre-wrap; word-break:break-word; user-select:text;}
  .line.rtl{direction:rtl; text-align:right; font-family:'Vazirmatn','JetBrains Mono',monospace;}
  .line.cmd{color:var(--ink);}
  .line.cmd .prompt{color:var(--accent); font-weight:600;}
  .line.dim{color:var(--ink-dim);}
  .line.accent{color:var(--accent);}
  .line.clay{color:var(--clay);}
  .line.err{color:var(--err);}
  .line.gap{height:10px;}

  .ascii{color:var(--accent); font-size:.72rem; line-height:1.35; margin-bottom:6px; white-space:pre;}

  a{color:var(--clay); text-decoration:none; border-bottom:1px dashed var(--clay); cursor:pointer;}
  a:hover{color:var(--accent); border-bottom-color:var(--accent);}

  #input-row{
    display:flex; align-items:center; gap:8px; padding:2px 0 4px;
  }
  #input-row .prompt{color:var(--accent); font-weight:600; flex-shrink:0; font-size:.92rem;}
  #cmd-input{
    flex:1; background:transparent; border:none; outline:none; color:var(--ink);
    font-family:'JetBrains Mono','Vazirmatn',monospace; font-size:.92rem; caret-color:var(--accent);
    direction:ltr;
  }

  #hint{
    flex-shrink:0; padding:9px 22px 16px; font-size:.72rem; color:var(--ink-dim);
    border-top:1px solid var(--border);
  }
  #hint.rtl{direction:rtl; text-align:right;}
  #hint b{color:var(--clay); font-family:'JetBrains Mono';}

  @media (max-width:640px){
    #screen{font-size:.85rem; padding:16px 14px 6px;}
    #hint{font-size:.68rem; padding:8px 14px 14px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.001s !important;}
  }
</style>

  function setLang(l){
    lang = l;
    langBadge.textContent = lang.toUpperCase();

  function runCommand(raw){
    var trimmed = raw.trim();
    addRaw('<span class="prompt">guest@ehsan:~$</span> ' + escapeHtml(trimmed), 'line cmd');
    if(trimmed === ''){ scrollBottom(); return; }
    var parts = trimmed.split(/\s+/);
    var name = parts[0].toLowerCase();
    if(commands.hasOwnProperty(name)){
      commands[name](parts[1]);
    } else {
      addLine('-bash: ' + name + ': command not found');
      addLine(lang === 'fa' ? "دستور نامعتبره — برای دیدن گزینه‌ها 'help' رو بزن" : "Unknown command — type 'help' to see options", r('dim'));
    }
    addGap();
    scrollBottom();
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      var val = input.value;
      history.push(val);
      histIndex = history.length;
      input.value = '';
      runCommand(val);
    } else if(e.key === 'ArrowUp'){
      if(histIndex > 0){ histIndex--; input.value = history[histIndex]; setTimeout(function(){input.selectionStart = input.selectionEnd = input.value.length;},0); }
      e.preventDefault();
    } else if(e.key === 'ArrowDown'){
      if(histIndex < history.length - 1){ histIndex++; input.value = history[histIndex]; }
      else { histIndex = history.length; input.value = ''; }
      e.preventDefault();
    }
  });

  function focusIfNoSelection(){
    var sel = window.getSelection();
    if(!sel || sel.toString().length === 0){

    }
